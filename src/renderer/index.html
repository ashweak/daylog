<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:">
<title>DAYLOG</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="tk" id="root">
  <button class="menu-btn" id="menuBtn" type="button" aria-label="Open menu" aria-expanded="false"><svg viewBox="0 0 8 8"><path d="M1 2h6v1H1zM1 4h6v1H1zM1 6h6v1H1z"/></svg></button>
  <div class="scrim" id="scrim" hidden></div>
  <aside id="aside">
    <div class="side">
      <div class="brand">DAYLOG<span class="blink">_</span></div>
      <nav class="nav" id="nav">
        <div class="ngroup">
          <a data-view="dashboard"><svg viewBox="0 0 8 8"><path d="M0 0h3v4H0zM4 0h4v2H4zM4 3h4v5H4zM0 5h3v3H0z"/></svg>Dashboard</a>
          <a data-view="today"><svg viewBox="0 0 8 8"><path d="M0 1h8v7H0zM1 3v4h6V3zM2 0h1v2H2zM5 0h1v2H5zM2 4h2v2H2z" fill-rule="evenodd"/></svg>Today</a>
          <a data-view="schedule"><svg viewBox="0 0 8 8"><path d="M0 1h8v7H0zM1 3v4h6V3zM2 0h1v2H2zM5 0h1v2H5zM2 4h1v1H2zM4 4h1v1H4zM2 6h1v1H2zM4 6h1v1H4z" fill-rule="evenodd"/></svg>Schedule</a>
        </div>
        <hr>
        <div class="ngroup">
          <a data-view="habits"><svg viewBox="0 0 8 8"><path d="M0 4h1v1h1v1h1V5h1V4h1V3h1V2h1V1h1v2H7v1H6v1H5v1H4v1H3v1H2V7H1V6H0z"/></svg>Habits</a>
          <a data-view="focus"><svg viewBox="0 0 8 8"><path d="M2 0h4v1h1v1h1v4H7v1H6v1H2V7H1V6H0V2h1V1h1zM2 2v4h4V2zM3 3h2v2H3z" fill-rule="evenodd"/></svg>Focus</a>
          <a data-view="activity"><svg viewBox="0 0 8 8"><path d="M0 1h8v5H0zM1 2v3h6V2zM3 6h2v1H3zM2 7h4v1H2z" fill-rule="evenodd"/></svg>Activity</a>
        </div>
        <hr>
        <div class="ngroup">
          <a data-view="settings"><svg viewBox="0 0 8 8"><path d="M3 0h2v1h1v1h1v1h1v2H7v1H6v1H5v1H3V7H2V6H1V5H0V3h1V2h1V1h1zM3 3v2h2V3z" fill-rule="evenodd"/></svg>Settings</a>
        </div>
      </nav>
      <div class="foot">
        <div class="mini" id="miniStatus"></div>
        <hr>
        <button class="theme-btn" id="themeBtn" type="button"><svg viewBox="0 0 8 8"><path d="M3 0h2v1H3zM3 7h2v1H3zM0 3h1v2H0zM7 3h1v2H7zM1 1h1v1H1zM6 1h1v1H6zM1 6h1v1H1zM6 6h1v1H6zM2 2h4v4H2z"/></svg><span>Light mode</span></button>
        <p class="credit">Ctrl+Shift+Space · quick add</p>
      </div>
    </div>
  </aside>
  <main id="main"></main>
  <canvas id="carLane" class="carlane" hidden aria-hidden="true"></canvas>
<div class="toast" id="toast" hidden></div>
<div class="modal" id="modal" hidden>
  <div class="mbox" role="dialog" aria-modal="true" aria-labelledby="mTitle">
    <p class="label" id="mLabel">confirm</p>
    <h3 id="mTitle"></h3>
    <p class="note" id="mBody"></p>
    <div class="row" style="justify-content:flex-end">
      <button class="btn" data-m="no">Cancel</button>
      <button class="btn pri" data-m="yes" id="mYes">Mark as done</button>
    </div>
  </div>
</div>
</div>

<script src="car.js"></script>
<script src="app.js"></script>
</body>
</html>
