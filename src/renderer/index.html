<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:">
<title>DAYLOG</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="tk" id="root">
  <aside>
    <div class="side">
      <div class="brand">DAYLOG<span class="blink">_</span></div>
      <nav class="nav" id="nav">
        <div class="ngroup">
          <a data-view="today"><svg viewBox="0 0 8 8"><path d="M0 1h8v7H0zM1 3v4h6V3zM2 0h1v2H2zM5 0h1v2H5zM2 4h2v2H2z" fill-rule="evenodd"/></svg>Today</a>
          <a data-view="timeline"><svg viewBox="0 0 8 8"><path d="M0 0h1v8H0zM2 1h5v2H2zM2 4h3v2H2zM2 7h6v1H2z"/></svg>Timeline</a>
          <a data-view="habits"><svg viewBox="0 0 8 8"><path d="M0 4h1v1h1v1h1V5h1V4h1V3h1V2h1V1h1v2H7v1H6v1H5v1H4v1H3v1H2V7H1V6H0z"/></svg>Habits</a>
          <a data-view="focus"><svg viewBox="0 0 8 8"><path d="M2 0h4v1h1v1h1v4H7v1H6v1H2V7H1V6H0V2h1V1h1zM2 2v4h4V2zM3 3h2v2H3z" fill-rule="evenodd"/></svg>Focus</a>
        </div>
        <hr>
        <div class="ngroup">
          <a data-view="activity"><svg viewBox="0 0 8 8"><path d="M0 1h8v5H0zM1 2v3h6V2zM3 6h2v1H3zM2 7h4v1H2z" fill-rule="evenodd"/></svg>Activity</a>
          <a data-view="review"><svg viewBox="0 0 8 8"><path d="M1 0h6v8H1zM2 1v6h4V1zM3 2h2v1H3zM3 4h2v1H3z" fill-rule="evenodd"/></svg>Review</a>
          <a data-view="insights"><svg viewBox="0 0 8 8"><path d="M0 7h8v1H0zM1 4h2v3H1zM3 1h2v6H3zM5 3h2v4H5z"/></svg>Insights</a>
          <a data-view="progress"><svg viewBox="0 0 8 8"><path d="M1 0h6v3H6v1H5v1H3V4H2V3H1zM3 5h2v1h1v2H2V6h1z"/></svg>Progress</a>
        </div>
        <hr>
        <div class="ngroup">
          <a data-view="settings"><svg viewBox="0 0 8 8"><path d="M3 0h2v1h1v1h1v1h1v2H7v1H6v1H5v1H3V7H2V6H1V5H0V3h1V2h1V1h1zM3 3v2h2V3z" fill-rule="evenodd"/></svg>Settings</a>
        </div>
      </nav>
      <div class="foot">
        <div class="mini" id="miniStatus"></div>
        <hr>
        <button class="theme-btn" id="themeBtn" type="button"><svg viewBox="0 0 8 8"><path d="M3 0h2v1H3zM3 7h2v1H3zM0 3h1v2H0zM7 3h1v2H7zM1 1h1v1H1zM6 1h1v1H6zM1 6h1v1H1zM6 6h1v1H6zM2 2h4v4H2z"/></svg><span>Light mode</span></button>
        <p class="credit">Ctrl+Shift+Space · quick add</p>
      </div>
    </div>
  </aside>
  <main id="main"></main>
</div>
<div class="toast" id="toast" hidden></div>
<script src="app.js"></script>
</body>
</html>
