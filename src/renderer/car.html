<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>DAYLOG car</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:transparent}
  canvas{position:absolute;left:0;bottom:0;image-rendering:pixelated}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// Original pixel supercar sprite (faces right). One char = one pixel.
const SPRITE = [
  '............rrrrrrr.............',
  '..........rrkkkkkkwrr...........',
  '........rrrkkkkkkkkkwrrr........',
  'kkk...rrrrrrrrrrrrrrrrrrrrr.....',
  'kdd.rrrrrrrrrrrrrrrrrrrrrrrrrr..',
  '.rrrrrrrwwwwwwrrrrrrrrrrrrrrrrry',
  'orrrrrrrrrrrrrrrrrrrrrrrrrrrrrrr',
  'rrrrddkkkkkddddddddddkkkkkddrrrr',
  '.rrdkkgggkkd........dkkgggkkdrr.',
  '....kgkkkgk..........kgkkkgk....',
  '.....kkkkk............kkkkk.....'
];
const WHEEL_B = { 'kgkkkgk': 'kkgkgkk', 'kkgggkk': 'kgkkkgk' }; // alternate frame for spinning wheels
const COLORS = { r: '#d7191c', d: '#8f0f12', k: '#111111', w: '#ffd9d9', g: '#9a9a9a', y: '#ffe680', o: '#ff7a00' };
const PX = 3, W = SPRITE[0].length * PX, H = SPRITE.length * PX;

const cv = document.getElementById('c'), x = cv.getContext('2d');
function resize() { cv.width = innerWidth; cv.height = innerHeight; x.imageSmoothingEnabled = false; }
addEventListener('resize', resize); resize();

function drawCar(px, py, facing, frame) {
  for (let r = 0; r < SPRITE.length; r++) {
    let row = SPRITE[r];
    if (frame && r >= 8) for (const [a, b] of Object.entries(WHEEL_B)) row = row.split(a).join(b);
    for (let c = 0; c < row.length; c++) {
      const ch = row[c]; if (ch === '.') continue;
      x.fillStyle = COLORS[ch];
      const cx = facing > 0 ? c : row.length - 1 - c;
      x.fillRect(Math.round(px) + cx * PX, py + r * PX, PX, PX);
    }
  }
}

// Behaviour: drive to a random spot, idle a bit, sometimes floor it.
const car = { x: -W, v: 0, facing: 1, target: innerWidth * 0.3, idle: 0, top: 2.2 };
const puffs = [];
let t = 0;
function pickTarget() {
  car.target = Math.random() * (innerWidth - W);
  car.top = Math.random() < 0.25 ? 6 : 1.2 + Math.random() * 1.8; // occasional sprint
}
function step() {
  t++;
  x.clearRect(0, 0, cv.width, cv.height);
  const dx = car.target - car.x;
  if (car.idle > 0) { car.idle--; car.v *= 0.85; }
  else if (Math.abs(dx) < 4 && Math.abs(car.v) < 0.3) { car.idle = 120 + Math.random() * 360; pickTarget(); }
  else {
    const dir = Math.sign(dx), brake = Math.abs(dx) < car.v * car.v * 6;
    car.v += brake ? -Math.sign(car.v) * 0.12 : dir * 0.06;
    car.v = Math.max(-car.top, Math.min(car.top, car.v));
    if (dir) car.facing = car.v !== 0 ? Math.sign(car.v) : dir;
    if (!brake && Math.abs(car.v) > 1 && t % 6 === 0) puffs.push({ x: car.facing > 0 ? car.x : car.x + W, y: cv.height - 9, a: 1, r: 2 });
  }
  car.x += car.v;
  // exhaust puffs
  for (const p of puffs) { p.x -= car.facing * 0.4; p.y -= 0.25; p.a -= 0.02; p.r += 0.08; }
  while (puffs.length && puffs[0].a <= 0) puffs.shift();
  for (const p of puffs) { x.fillStyle = `rgba(160,160,160,${p.a.toFixed(2)})`; const s = Math.round(p.r) * 2; x.fillRect(Math.round(p.x), Math.round(p.y), s, s); }
  const moving = Math.abs(car.v) > 0.2;
  drawCar(car.x, cv.height - H, car.facing, moving && Math.floor(t / Math.max(2, 8 - Math.abs(car.v) * 2)) % 2);
  requestAnimationFrame(step);
}
step();
</script>
</body>
</html>
